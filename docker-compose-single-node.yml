# ==============================================================================
# JettraStore Ecosystem - Docker Compose Single-Node (1 Nodo + Shell + Explorer)
# Optimizado para bajo consumo de RAM/CPU y storage persistente permanente
# ==============================================================================
services:
  jettra-node-01:
    build:
      context: ./JettraStore
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastore:1.0
    container_name: jettra-single-node-01
    hostname: jettra-node-01
    restart: unless-stopped
    ports:
      - "${JETTRA_NODE1_REST_PORT:-60001}:60001"
      - "${JETTRA_NODE1_GRPC_PORT:-50001}:50001"
    environment:
      - JETTRA_NODE_ID=node-01
      - JETTRA_NODE_ROLE=PRIMARY
      - JETTRA_NODE_IP=jettra-node-01
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_MULTINODE_ACTIVE=off
      - JETTRA_CLUSTER_CONFIG_PATH=/jettra/config/cluster.config
      - JETTRA_REST_PORT=60001
      - JETTRA_GRPC_PORT=50001
      - JETTRA_ADMIN_USERNAME=admin
      - JETTRA_ADMIN_PASSWORD=admin-jettra
      - JETTRA_SAMPLES_AUTOLOAD=false
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m
    mem_limit: 640m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_single_data_node01:/jettra/data
      - jettra_single_checkpoint_node01:/jettra/checkpoint
      - ./docker/cluster-single-node.config:/jettra/config/cluster.config:ro
    networks:
      - jettra-single-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:60001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  jettra-shell:
    build:
      context: ./JettraStoreShell
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastoreshell:1.0
    container_name: jettra-single-shell
    stdin_open: true
    tty: true
    depends_on:
      jettra-node-01:
        condition: service_healthy
    environment:
      - JETTRA_HOST=jettra-node-01
      - JETTRA_PORT=50001
      - MICROPROFILE_CONFIG_FILE=/app/config/microprofile-config.properties
      - JAVA_OPTS=-Xms48m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -Dcluster.config.path=/jettra/config/cluster.config -Dcluster.nodes=node-01:jettra-node-01:50001
    mem_limit: 320m
    mem_reservation: 48m
    cpus: 0.5
    volumes:
      - jettra_single_shell_data:/home/jettra/.jettra
      - ./docker/cluster-single-node.config:/jettra/config/cluster.config:ro
    networks:
      - jettra-single-net

  jettrastore-explorer:
    build:
      context: ./JettraStoreExplorer
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastoreexplorer:1.0
    container_name: jettra-single-explorer
    restart: unless-stopped
    depends_on:
      jettra-node-01:
        condition: service_healthy
    ports:
      - "${JETTRA_EXPLORER_PORT:-8085}:8085"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8085
      - STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_DOCKER_COMPOSE=true
      - MICROPROFILE_CONFIG_FILE=/app/config/microprofile-config.properties
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Dcluster.config.path=/jettra/config/cluster.config -Dcluster.nodes=node-01:jettra-node-01:50001
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_single_explorer_memory:/app/memory
      - ./docker/cluster-single-node.config:/jettra/config/cluster.config:ro
    networks:
      - jettra-single-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  jettra_single_data_node01:
    name: jettra_single_data_node01
    driver: local
  jettra_single_checkpoint_node01:
    name: jettra_single_checkpoint_node01
    driver: local
  jettra_single_shell_data:
    name: jettra_single_shell_data
    driver: local
  jettra_single_explorer_memory:
    name: jettra_single_explorer_memory
    driver: local

networks:
  jettra-single-net:
    name: jettra-single-net
    driver: bridge

# ==============================================================================
# JettraStore Ecosystem - Docker Compose Multi-Nodo (3 Nodos Raft + Shell + Explorer)
# Optimizado para bajo consumo de RAM/CPU y storage persistente independiente por nodo
# ==============================================================================
services:
  jettra-node-01:
    build:
      context: ./JettraStore
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastore:1.0
    container_name: jettra-node-01
    hostname: jettra-node-01
    restart: unless-stopped
    ports:
      - "${JETTRA_NODE1_REST_PORT:-60001}:60001"
      - "${JETTRA_NODE1_GRPC_PORT:-50001}:50001"
    environment:
      - JETTRA_NODE_ID=node-01
      - JETTRA_NODE_ROLE=PRIMARY
      - JETTRA_NODE_IP=jettra-node-01
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/jettra/cluster-state
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_MULTINODE_ACTIVE=on
      - JETTRA_CLUSTER_CONFIG_PATH=/jettra/config/cluster.config
      - JETTRA_REST_PORT=60001
      - JETTRA_GRPC_PORT=50001
      - JETTRA_ADMIN_USERNAME=admin
      - JETTRA_ADMIN_PASSWORD=admin-jettra
      - JETTRA_SAMPLES_AUTOLOAD=false
      - JETTRA_CLUSTER_PEERS=node-02:jettra-node-02:50002:SECONDARY,node-03:jettra-node-03:50003:SECONDARY
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m
    mem_limit: 640m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_data_node01:/jettra/data
      - jettra_checkpoint_node01:/jettra/checkpoint
      - jettra_state_node01:/jettra/cluster-state
      - ./docker/cluster-3nodes.config:/jettra/config/cluster.config:ro
    networks:
      - jettra-cluster-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:60001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  jettra-node-02:
    build:
      context: ./JettraStore
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastore:1.0
    container_name: jettra-node-02
    hostname: jettra-node-02
    restart: unless-stopped
    depends_on:
      jettra-node-01:
        condition: service_healthy
    ports:
      - "${JETTRA_NODE2_REST_PORT:-60002}:60002"
      - "${JETTRA_NODE2_GRPC_PORT:-50002}:50002"
    environment:
      - JETTRA_NODE_ID=node-02
      - JETTRA_NODE_ROLE=SECONDARY
      - JETTRA_NODE_IP=jettra-node-02
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/jettra/cluster-state
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_MULTINODE_ACTIVE=on
      - JETTRA_REST_PORT=60002
      - JETTRA_GRPC_PORT=50002
      - JETTRA_ADMIN_USERNAME=admin
      - JETTRA_ADMIN_PASSWORD=admin-jettra
      - JETTRA_SAMPLES_AUTOLOAD=false
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m
    mem_limit: 640m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_data_node02:/jettra/data
      - jettra_checkpoint_node02:/jettra/checkpoint
      - jettra_state_node02:/jettra/cluster-state
    networks:
      - jettra-cluster-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:60002/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  jettra-node-03:
    build:
      context: ./JettraStore
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastore:1.0
    container_name: jettra-node-03
    hostname: jettra-node-03
    restart: unless-stopped
    depends_on:
      jettra-node-01:
        condition: service_healthy
    ports:
      - "${JETTRA_NODE3_REST_PORT:-60003}:60003"
      - "${JETTRA_NODE3_GRPC_PORT:-50003}:50003"
    environment:
      - JETTRA_NODE_ID=node-03
      - JETTRA_NODE_ROLE=SECONDARY
      - JETTRA_NODE_IP=jettra-node-03
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/jettra/cluster-state
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_MULTINODE_ACTIVE=on
      - JETTRA_REST_PORT=60003
      - JETTRA_GRPC_PORT=50003
      - JETTRA_ADMIN_USERNAME=admin
      - JETTRA_ADMIN_PASSWORD=admin-jettra
      - JETTRA_SAMPLES_AUTOLOAD=false
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m
    mem_limit: 640m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_data_node03:/jettra/data
      - jettra_checkpoint_node03:/jettra/checkpoint
      - jettra_state_node03:/jettra/cluster-state
    networks:
      - jettra-cluster-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:60003/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  jettra-shell:
    build:
      context: ./JettraStoreShell
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastoreshell:1.0
    container_name: jettra-shell
    stdin_open: true
    tty: true
    depends_on:
      jettra-node-01:
        condition: service_healthy
    environment:
      - JETTRA_HOST=jettra-node-01
      - JETTRA_PORT=50001
      - MICROPROFILE_CONFIG_FILE=/app/config/microprofile-config.properties
      - JETTRA_CONNECTION_CONFIG_DIR=/app/config
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/app/cluster-state
      - CLUSTER_IP_NODES=${CLUSTER_IP_NODES:-jettra-node-01:50001}
      - JAVA_OPTS=-Xms48m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -Djettra.cluster_state_config_dir=/app/cluster-state -Dcluster.ip.nodes=${CLUSTER_IP_NODES:-jettra-node-01:50001}
    mem_limit: 320m
    mem_reservation: 48m
    cpus: 0.5
    volumes:
      - jettra_shell_data:/home/jettra/.jettra
      - jettra_shell_config:/app/config
      - jettra_shell_state:/app/cluster-state
    networks:
      - jettra-cluster-net

  jettrastore-explorer:
    build:
      context: ./JettraStoreExplorer
      dockerfile: Dockerfile
    pull_policy: build
    image: ${DOCKER_REPO_PREFIX:-}jettrastoreexplorer:1.0
    container_name: jettrastore-explorer
    restart: unless-stopped
    depends_on:
      jettra-node-01:
        condition: service_healthy
    ports:
      - "${JETTRA_EXPLORER_PORT:-8085}:8085"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8085
      - STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_DOCKER_COMPOSE=true
      - MICROPROFILE_CONFIG_FILE=/app/config/microprofile-config.properties
      - JETTRA_CONNECTION_CONFIG_DIR=/app/config
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/app/cluster-state
      - CLUSTER_IP_NODES=${CLUSTER_IP_NODES:-jettra-node-01:50001}
      - JAVA_OPTS=-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Djettra.cluster_state_config_dir=/app/cluster-state -Dcluster.ip.nodes=${CLUSTER_IP_NODES:-jettra-node-01:50001}
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      - jettra_explorer_memory:/app/memory
      - jettra_explorer_config:/app/config
      - jettra_explorer_state:/app/cluster-state
    networks:
      - jettra-cluster-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  jettra_data_node01:
    name: jettra_data_node01
    driver: local
  jettra_data_node02:
    name: jettra_data_node02
    driver: local
  jettra_data_node03:
    name: jettra_data_node03
    driver: local
  jettra_checkpoint_node01:
    name: jettra_checkpoint_node01
    driver: local
  jettra_checkpoint_node02:
    name: jettra_checkpoint_node02
    driver: local
  jettra_checkpoint_node03:
    name: jettra_checkpoint_node03
    driver: local
  jettra_shell_data:
    name: jettra_shell_data
    driver: local
  jettra_shell_config:
    name: jettra_shell_config
    driver: local
  jettra_explorer_memory:
    name: jettra_explorer_memory
    driver: local
  jettra_explorer_config:
    name: jettra_explorer_config
    driver: local
  jettra_state_node01:
    name: jettra_state_node01
    driver: local
  jettra_state_node02:
    name: jettra_state_node02
    driver: local
  jettra_state_node03:
    name: jettra_state_node03
    driver: local
  jettra_shell_state:
    name: jettra_shell_state
    driver: local
  jettra_explorer_state:
    name: jettra_explorer_state
    driver: local

networks:
  jettra-cluster-net:
    name: jettra-cluster-net
    driver: bridge

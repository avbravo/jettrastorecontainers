# ==============================================================================
# JettraStore - Docker Compose de Un Solo Nodo con Conciencia de Clúster en Red
# Despliega únicamente EL nodo local de este servidor, declarando en
# JETTRA_CLUSTER_PEERS los demás nodos remotos del clúster Raft.
#
# Uso en cada servidor (cada servidor tiene su propio archivo .env):
#   docker compose --env-file .env -f docker/docker-compose-only-node-servers.yml up -d
# ==============================================================================

services:
  jettra-node:
    image: ${JETTRA_DOCKER_IMAGE:-avbravo/jettrastore:1.0-SNAPSHOT}
    pull_policy: ${JETTRA_PULL_POLICY:-if_not_present}
    container_name: ${JETTRA_CONTAINER_NAME:-jettra-node-01}
    hostname: ${JETTRA_NODE_ID:-node-01}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${JETTRA_HOST_BIND:-0.0.0.0}:${JETTRA_GRPC_PORT:-50001}:${JETTRA_GRPC_PORT:-50001}"
      - "${JETTRA_HOST_BIND:-0.0.0.0}:${JETTRA_REST_PORT:-60001}:${JETTRA_REST_PORT:-60001}"
    environment:
      # Identidad del nodo local en este servidor
      - JETTRA_NODE_ID=${JETTRA_NODE_ID:-node-01}
      - JETTRA_NODE_ROLE=${JETTRA_NODE_ROLE:-PRIMARY}
      - JETTRA_NODE_IP=${JETTRA_NODE_IP:-192.168.10.11}
      - JETTRA_GRPC_PORT=${JETTRA_GRPC_PORT:-50001}
      - JETTRA_REST_PORT=${JETTRA_REST_PORT:-60001}
      # Activación de clúster Raft e identificación de los demás nodos de la red
      - JETTRA_MULTINODE_ACTIVE=on
      - JETTRA_CLUSTER_MULTINODE_ACTIVE=on
      - JETTRA_CLUSTER_CONFIG_PATH=${JETTRA_CLUSTER_CONFIG_PATH:-}
      - JETTRA_CLUSTER_PEERS=${JETTRA_CLUSTER_PEERS:-}
      # Persistencia, motor de almacenamiento y estado de membresía (RF-32)
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_INDEX_STORAGE_PATH=/jettra/data/indexes
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/jettra/cluster-state
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_CRAC_CHECKPOINT_PATH=/jettra/checkpoint
      - JETTRA_CRAC_RESTORE=${JETTRA_CRAC_RESTORE:-false}
      # Seguridad y afinación JVM
      - JETTRA_ADMIN_USERNAME=${JETTRA_ADMIN_USERNAME:-admin}
      - JETTRA_ADMIN_PASSWORD=${JETTRA_ADMIN_PASSWORD:-admin-jettra}
      - JETTRA_SAMPLES_AUTOLOAD=${JETTRA_SAMPLES_AUTOLOAD:-false}
      - JAVA_OPTS=${JAVA_OPTS:--Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m}
    mem_limit: ${JETTRA_MEM_LIMIT:-640m}
    mem_reservation: 128m
    cpus: ${JETTRA_CPUS:-1.0}
    volumes:
      - jettra_only_node_data:/jettra/data
      - jettra_only_node_checkpoint:/jettra/checkpoint
      - jettra_only_node_state:/jettra/cluster-state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${JETTRA_REST_PORT:-60001}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  jettra_only_node_data:
    name: ${JETTRA_DATA_VOLUME_NAME:-jettra_only_node_data}
    driver: local
  jettra_only_node_checkpoint:
    name: ${JETTRA_CHECKPOINT_VOLUME_NAME:-jettra_only_node_checkpoint}
    driver: local
  jettra_only_node_state:
    name: ${JETTRA_STATE_VOLUME_NAME:-jettra_only_node_state}
    driver: local

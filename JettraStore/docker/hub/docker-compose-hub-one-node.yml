# ==============================================================================
# JettraStore - Docker Compose Single-Node desde Docker Hub (avbravo/jettrastore:1.0-SNAPSHOT)
# Archivo: docker/hub/docker-compose-hub-one-node.yml
# Expone cluster.node.ip/grpc.port/rest.port y persiste cluster-state.config en
# jettra.cluster_state_config_dir (/jettra/cluster-state). Solo el nodo PRIMARY
# puede recibir opcionalmente cluster.config vía JETTRA_CLUSTER_CONFIG_PATH.
# ==============================================================================
services:
  jettrastore:
    image: ${JETTRA_DOCKER_IMAGE:-avbravo/jettrastore:1.0-SNAPSHOT}
    pull_policy: ${JETTRA_PULL_POLICY:-if_not_present}
    container_name: ${JETTRA_CONTAINER_NAME:-jettrastore}
    hostname: ${JETTRA_NODE_IP:-jettra-node-01}
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "${JETTRA_CONTAINER_GRPC_PORT:-50001}"
      - "${JETTRA_CONTAINER_REST_PORT:-60001}"
    ports:
      - "${JETTRA_HOST_BIND:-0.0.0.0}:${JETTRA_HOST_GRPC_PORT:-${JETTRA_GRPC_PORT:-50001}}:${JETTRA_CONTAINER_GRPC_PORT:-50001}"
      - "${JETTRA_HOST_BIND:-0.0.0.0}:${JETTRA_HOST_REST_PORT:-${JETTRA_REST_PORT:-60001}}:${JETTRA_CONTAINER_REST_PORT:-60001}"
    environment:
      - CLUSTER_NODE_ID=${CLUSTER_NODE_ID:-${JETTRA_NODE_ID:-node-01}}
      - CLUSTER_NODE_ROLE=${CLUSTER_NODE_ROLE:-${JETTRA_NODE_ROLE:-PRIMARY}}
      - CLUSTER_NODE_IP=${CLUSTER_NODE_IP:-${JETTRA_NODE_IP:-jettra-node-01}}
      - CLUSTER_NODE_GRPC_PORT=${CLUSTER_NODE_GRPC_PORT:-${JETTRA_CONTAINER_GRPC_PORT:-50001}}
      - CLUSTER_NODE_REST_PORT=${CLUSTER_NODE_REST_PORT:-${JETTRA_CONTAINER_REST_PORT:-60001}}
      - JETTRA_NODE_ID=${CLUSTER_NODE_ID:-${JETTRA_NODE_ID:-node-01}}
      - JETTRA_NODE_ROLE=${CLUSTER_NODE_ROLE:-${JETTRA_NODE_ROLE:-PRIMARY}}
      - JETTRA_NODE_IP=${CLUSTER_NODE_IP:-${JETTRA_NODE_IP:-jettra-node-01}}
      - JETTRA_STORAGE_PATH=/jettra/data
      - JETTRA_INDEX_STORAGE_PATH=/jettra/data/indexes
      - JETTRA_CLUSTER_STATE_CONFIG_DIR=/jettra/cluster-state
      - JETTRA_STORAGE_MODE=${JETTRA_STORAGE_MODE:-OFF_HEAP}
      - JETTRA_MULTINODE_ACTIVE=${JETTRA_MULTINODE_ACTIVE:-off}
      - JETTRA_CLUSTER_MULTINODE_ACTIVE=${JETTRA_MULTINODE_ACTIVE:-off}
      - JETTRA_CLUSTER_PEERS=${JETTRA_CLUSTER_PEERS:-}
      # Opcional y efectivo únicamente cuando CLUSTER_NODE_ROLE=PRIMARY (los SECONDARY ignoran cluster.conf)
      - JETTRA_CLUSTER_CONFIG_PATH=${JETTRA_CLUSTER_CONFIG_PATH:-}
      - JETTRA_GRPC_PORT=${CLUSTER_NODE_GRPC_PORT:-${JETTRA_CONTAINER_GRPC_PORT:-50001}}
      - JETTRA_REST_PORT=${CLUSTER_NODE_REST_PORT:-${JETTRA_CONTAINER_REST_PORT:-60001}}
      - JETTRA_ADMIN_USERNAME=${JETTRA_ADMIN_USERNAME:-admin}
      - JETTRA_ADMIN_PASSWORD=${JETTRA_ADMIN_PASSWORD:-admin-jettra}
      - JETTRA_SAMPLES_AUTOLOAD=${JETTRA_SAMPLES_AUTOLOAD:-false}
      - JAVA_OPTS=${JAVA_OPTS:--Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=192m}
    mem_limit: 640m
    mem_reservation: 128m
    cpus: 1.0
    volumes:
      # Persistencia permanente en disco (sobrevive a `docker compose down` y `docker rmi`):
      # Por defecto usa el volumen nombrado Docker; puede apuntar a una carpeta física del host
      # exportando JETTRA_DATA_VOLUME=/ruta/en/disco (asegurando permisos UID 1000:1000).
      - ${JETTRA_DATA_VOLUME:-jettrastore_hub_data}:/jettra/data
      - ${JETTRA_CHECKPOINT_VOLUME:-jettrastore_hub_checkpoint}:/jettra/checkpoint
      - ${JETTRA_STATE_VOLUME:-jettrastore_hub_state}:/jettra/cluster-state
    networks:
      - jettra-hub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CLUSTER_NODE_REST_PORT:-${JETTRA_CONTAINER_REST_PORT:-60001}}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  jettrastore_hub_data:
    name: ${JETTRA_DATA_VOLUME_NAME:-jettrastore_hub_data}
    driver: local
  jettrastore_hub_checkpoint:
    name: ${JETTRA_CHECKPOINT_VOLUME_NAME:-jettrastore_hub_checkpoint}
    driver: local
  jettrastore_hub_state:
    name: ${JETTRA_STATE_VOLUME_NAME:-jettrastore_hub_state}
    driver: local

networks:
  jettra-hub-net:
    name: ${JETTRA_NETWORK_NAME:-jettra-hub-net}
    driver: bridge

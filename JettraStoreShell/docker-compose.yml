services:
  # ==============================================================================
  # JETTRASTORE SHELL - CONSOLA INTERACTIVA CLI
  # ==============================================================================
  jettra-shell:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: jettrastoreshell:1.0
    container_name: jettra-shell
    stdin_open: true
    tty: true
    restart: "no"
    mem_limit: 512m
    mem_reservation: 64m
    environment:
      - JETTRA_HOST=jettra-node-01
      - JETTRA_PORT=9091
      - JAVA_OPTS=-Xms64m -Xmx512m -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:+UseCompactObjectHeaders --enable-preview --enable-native-access=ALL-UNNAMED
    volumes:
      - jettra_shell_data:/home/jettra/.jettra
    networks:
      - jettra-cluster-net

volumes:
  jettra_shell_data:
    name: jettra_shell_data
    driver: local

networks:
  jettra-cluster-net:
    name: jettra-cluster-net
    external: true

services:
  # ==============================================================================
  # JETTRASTORE SHELL - CONSOLA INTERACTIVA CLI
  # ==============================================================================
  jettra-shell:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: jettrastoreshell:1.0
    container_name: jettra-shell
    stdin_open: true
    tty: true
    restart: "no"
    mem_limit: 320m
    mem_reservation: 48m
    cpus: 0.5
    environment:
      - MICROPROFILE_CONFIG_FILE=/app/config/microprofile-config.properties
      - JETTRA_CONNECTION_CONFIG_DIR=/app/config
      - CLUSTER_IP_NODES=${CLUSTER_IP_NODES:-jettra-node-01:50001}
      - JETTRA_HOST=jettra-node-01
      - JETTRA_PORT=50001
      - JAVA_OPTS=-Xms48m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -Dcluster.ip.nodes=${CLUSTER_IP_NODES:-jettra-node-01:50001}
    volumes:
      - jettra_shell_data:/home/jettra/.jettra
      - jettra_shell_config:/app/config
    networks:
      - jettra-cluster-net

volumes:
  jettra_shell_data:
    name: jettra_shell_data
    driver: local
  jettra_shell_config:
    name: jettra_shell_config
    driver: local

networks:
  jettra-cluster-net:
    name: jettra-cluster-net
    external: true
